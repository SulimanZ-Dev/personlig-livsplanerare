[package]
name = "livssystem"
version = "1.3.0"
description = "Desktop shell for Livssystem"
authors = ["SulimanZ-Dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
